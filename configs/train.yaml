# Baseline autoencoder (Hemati et al., 2022 / reference code defaults)
baseline_ae:
  encoder_dim: [128, 64, 32, 16, 8, 4, 2]
  bottleneck: tanh
  lr: 1.0e-4
  weight_decay: 1.0e-6
  batch_size: 128
  epochs: 100
  # continual strategies (training/strategies.py; used by the finetune regime)
  ewc_lambda: 1.0e+4     # sanity run (Philadelphia, linear, 3 epochs): lambda/2*penalty ~ loss under free drift
  # evidence: results/logs/ewc_lambda_sanity.log (scripts/ewc_lambda_sanity.py)
  ewc_samples: 2048      # records sampled per experience for the diagonal Fisher
  buffer_size: 2000      # replay memory (~20% of a ~9.5k-record experience)
  buffer_rule: random    # random | diversity | high_error
  buffer_candidates: 5000  # new-experience records considered by diversity / high_error
  buffer_filter_q: 0.05    # "filtered" rule: share of (buffer + new experience) with the highest anomaly score dropped
# Masked-feature tabular model (M1)
masked:
  d_embed: 16
  hidden: [256, 128]
  latent: 32
  mask_ratio: 0.3
  dropout: 0.1
  lr: 1.0e-3
  weight_decay: 1.0e-5
  batch_size: 256
  epochs: 30
  # continual strategies (training/strategies.py; used by the finetune regime)
  ewc_lambda: 1.0e+4     # sanity run (Philadelphia, linear, 3 epochs): lambda/2*penalty ~ loss under free drift
  # evidence: results/logs/ewc_lambda_sanity.log (scripts/ewc_lambda_sanity.py)
  ewc_samples: 2048      # records sampled per experience for the diagonal Fisher
  buffer_size: 2000      # replay memory (~20% of a ~9.5k-record experience)
  buffer_rule: random    # random | diversity | high_error
  buffer_candidates: 5000  # new-experience records considered by diversity / high_error
  buffer_filter_q: 0.05    # "filtered" rule: share of (buffer + new experience) with the highest anomaly score dropped
