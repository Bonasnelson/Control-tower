[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "controltower"
version = "0.1.0"
description = "Control Tower / DriftLedger: drift-aware, explainable continual learning for journal-entry and fraud risk monitoring (COMP 5116 project)"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "pyyaml>=6.0", "requests>=2.28"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
